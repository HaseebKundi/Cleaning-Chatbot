<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sparkle Clean Co. — Chat</title>
<style>
  :root {
    --brand: #2f9e44;
    --brand-dark: #22782f;
    --bg: #ffffff;
    --bubble-user: #2f9e44;
    --bubble-bot: #f1f3f5;
    --text-dark: #212529;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: transparent;
  }

  /* Floating bubble button */
  #chat-bubble {
    position: fixed;
    bottom: 24px;
    right: 24px;
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: var(--brand);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(0,0,0,0.2);
    font-size: 26px;
    z-index: 9999;
    transition: transform 0.15s ease;
  }
  #chat-bubble:hover { transform: scale(1.06); }

  /* Chat window */
  #chat-window {
    position: fixed;
    bottom: 96px;
    right: 24px;
    width: 360px;
    max-width: 92vw;
    height: 520px;
    max-height: 78vh;
    background: var(--bg);
    border-radius: 16px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    display: none;
    flex-direction: column;
    overflow: hidden;
    z-index: 9999;
  }
  #chat-window.open { display: flex; }

  #chat-header {
    background: var(--brand);
    color: white;
    padding: 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  #chat-header .title { font-weight: 600; font-size: 15px; }
  #chat-header .subtitle { font-size: 12px; opacity: 0.85; margin-top: 2px; }
  #chat-close { cursor: pointer; font-size: 20px; line-height: 1; opacity: 0.9; }

  #chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    background: #fafafa;
  }
  .msg {
    max-width: 82%;
    padding: 10px 13px;
    border-radius: 14px;
    font-size: 14px;
    line-height: 1.4;
    white-space: pre-wrap;
  }
  .msg.user {
    align-self: flex-end;
    background: var(--bubble-user);
    color: white;
    border-bottom-right-radius: 4px;
  }
  .msg.bot {
    align-self: flex-start;
    background: var(--bubble-bot);
    color: var(--text-dark);
    border-bottom-left-radius: 4px;
  }

  #suggestions {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    padding: 0 14px 10px 14px;
    background: #fafafa;
  }
  .suggestion-chip {
    border: 1px solid var(--brand);
    color: var(--brand-dark);
    background: white;
    border-radius: 999px;
    padding: 6px 12px;
    font-size: 12.5px;
    cursor: pointer;
  }
  .suggestion-chip:hover { background: #eafaf0; }

  #chat-input-row {
    display: flex;
    padding: 10px;
    border-top: 1px solid #eee;
    background: white;
  }
  #chat-input {
    flex: 1;
    border: 1px solid #ddd;
    border-radius: 20px;
    padding: 10px 14px;
    font-size: 14px;
    outline: none;
  }
  #chat-input:focus { border-color: var(--brand); }
  #chat-send {
    margin-left: 8px;
    background: var(--brand);
    color: white;
    border: none;
    border-radius: 50%;
    width: 40px;
    height: 40px;
    cursor: pointer;
    font-size: 16px;
  }
  #chat-send:disabled { opacity: 0.5; cursor: default; }
</style>
</head>
<body>

<div id="chat-bubble" onclick="toggleChat()">💬</div>

<div id="chat-window">
  <div id="chat-header">
    <div>
      <div class="title">Sparkle Clean Co.</div>
      <div class="subtitle">Usually replies in a few minutes</div>
    </div>
    <div style="display: flex; align-items: center; gap: 14px;">
      <div id="new-chat-btn" onclick="startNewChat()" title="Start a new chat"
           style="cursor: pointer; font-size: 12.5px; border: 1px solid rgba(255,255,255,0.6); border-radius: 999px; padding: 5px 10px;">
        New Chat
      </div>
      <div id="chat-close" onclick="toggleChat()">✕</div>
    </div>
  </div>

  <div id="chat-messages"></div>

  <div id="suggestions">
    <div class="suggestion-chip" onclick="sendSuggestion('Get a free quote')">Get a free quote</div>
    <div class="suggestion-chip" onclick="sendSuggestion('What areas do you service?')">What areas do you service?</div>
    <div class="suggestion-chip" onclick="sendSuggestion('Book a cleaning')">Book a cleaning</div>
  </div>

  <div id="chat-input-row">
    <input id="chat-input" type="text" placeholder="Type a message..." onkeydown="if(event.key==='Enter') sendMessage();" />
    <button id="chat-send" onclick="sendMessage()">➤</button>
  </div>
</div>

<script>
  // Point this at your deployed FastAPI backend.
  const API_BASE = "http://localhost:8000";

  let sessionId = "web-" + Math.random().toString(36).slice(2, 10);
  let greeted = false;

  function toggleChat() {
    const win = document.getElementById("chat-window");
    win.classList.toggle("open");
    if (win.classList.contains("open") && !greeted) {
      greeted = true;
      appendMessage("bot", "Hi! 👋 I can help you get a free quote, book a cleaning, or answer questions about our service. What can I help with?");
    }
  }

  // Demo mode: open the chat automatically on page load instead of
  // waiting for the floating bubble to be clicked.
  window.addEventListener("DOMContentLoaded", () => {
    document.getElementById("chat-window").classList.add("open");
    greeted = true;
    appendMessage("bot", "Hi! 👋 I can help you get a free quote, book a cleaning, or answer questions about our service. What can I help with?");
  });

  function startNewChat() {
    // Fresh session ID so the backend doesn't carry over old conversation memory.
    sessionId = "web-" + Math.random().toString(36).slice(2, 10);

    // Clear the visible message history.
    document.getElementById("chat-messages").innerHTML = "";

    // Bring the suggestion chips back.
    const suggestions = document.getElementById("suggestions");
    if (suggestions) suggestions.style.display = "flex";

    // Re-greet.
    appendMessage("bot", "Hi! 👋 I can help you get a free quote, book a cleaning, or answer questions about our service. What can I help with?");
  }

  function appendMessage(role, text) {
    const container = document.getElementById("chat-messages");
    const el = document.createElement("div");
    el.className = "msg " + role;
    el.textContent = text;
    container.appendChild(el);
    container.scrollTop = container.scrollHeight;
    return el;
  }

  function sendSuggestion(text) {
    document.getElementById("chat-input").value = text;
    sendMessage();
  }

  async function sendMessage() {
    const input = document.getElementById("chat-input");
    const text = input.value.trim();
    if (!text) return;
    input.value = "";
    document.getElementById("chat-send").disabled = true;

    // Hide the suggestion chips once the user sends their first message.
    const suggestions = document.getElementById("suggestions");
    if (suggestions) suggestions.style.display = "none";

    appendMessage("user", text);
    const botEl = appendMessage("bot", "");

    try {
      const resp = await fetch(`${API_BASE}/chat/stream`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ session_id: sessionId, message: text }),
      });

      const reader = resp.body.getReader();
      const decoder = new TextDecoder();
      let full = "";
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        full += decoder.decode(value, { stream: true });
        botEl.textContent = full;
        document.getElementById("chat-messages").scrollTop = 999999;
      }
    } catch (err) {
      botEl.textContent = "Sorry, something went wrong. Please try again in a moment.";
      console.error(err);
    } finally {
      document.getElementById("chat-send").disabled = false;
    }
  }
</script>

</body>
</html>
